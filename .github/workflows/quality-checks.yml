name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Static analysis
        run: ruff check app.py modules tests --select=E9,F63,F7,F82,F401,F841

      - name: Security static analysis
        run: bandit -r app.py modules -ll

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

      - name: Compile Python files
        run: python -m compileall app.py modules

      - name: Run automated tests with coverage
        run: coverage run --source=modules -m pytest -q

      - name: Enforce coverage threshold
        run: coverage report --fail-under=85
